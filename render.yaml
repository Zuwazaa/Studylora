services:
  - type: web
    name: studylora-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://studylora.vercel.app
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.8-flash,gemini-3.5-flash-lite
      - key: BOOKS_LEGACY_URL
        value: https://pub-29c11e82661d4766a8c49675efbaaaec.r2.dev
      - key: R2_BUCKET
        value: studylora
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
