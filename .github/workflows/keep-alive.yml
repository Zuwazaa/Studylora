# Render bepul serveri 15 daqiqa so'rovsiz qolsa uxlaydi va uyg'onishiga ~50 soniya ketadi.
# Har 10 daqiqada sog'liq tekshiruviga murojaat qilib, uni uyg'oq ushlab turamiz.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://studylora-api.onrender.com/api/health
